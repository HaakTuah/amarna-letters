# The description check on this repository's own pull requests: the same script projects run from their copy
# (scripts/pr-description.mjs), here from its source, with the line that says what a pull request opened since it came
# waits on, and the line that lists what its changed paths called for (PR_CREATED, read against the base's history through the read-only token). A description put right is checked again by itself (the type
# "edited"). A pull request that changes a rule file (the floor, a role's file or a module) is asked for one more, "What holds it"
# (AGENTS.md, "Every rule says what holds it"), and one that changes the floor, a module, a script (the checks), the
# setup (the starter kit and the sync notes) or a workflow, "What it asks of a project" (AGENTS.md, "Nothing locks a
# project"): whether it does is read from git alone, the merge commit against its first parent, the base, and nothing
# of the pull request's own text reaches that step's script. One that changes the floor or the review guidelines quotes
# the owner's yes found word for word on its issue, from an account the host gives maintain or admin and edited, where
# at all, by such accounts alone, which the script reads with this run's token (scripts/owner-yes.mjs; floor rule 3;
# #549). One that changes QUEUE.md leaves no line of a closed issue there (scripts/queue.mjs; AGENTS.md, "The queue";
# #750, point 1). On a draft it reports what it would fail and passes, so a draft's builder sees it early and is stopped
# by nothing (#750, point 4). This repository only;
# no project calls it. Reads only, with no secret: the description reaches the script through env and is never
# written into a run line (floor rule 2).
name: own-description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: own-description-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  own-description:
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the merge commit and its parents: what the pull request changes is read against the base
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version # the one exact Node ("Node" in the core's tasks/updates.md)
          package-manager-cache: false # (no cache restored over the checkout before the check: the proof of path-only.mjs runs main's code)
      - name: The core's packages, installed from its lock file for the core's description check (#654)
        run: node scripts/install.mjs
      - name: The description has its parts, and where the rules change, what holds the change and what it asks
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CREATED: ${{ github.event.pull_request.created_at }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }} # (read only: the base's commits and copy, for the day it gained a line, the issues a pull request queues or closes, and the right of each account that wrote or edited the texts of the issue it names)
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # (a diff that cannot be read counts as a change: each heading is asked for, never waived)
          parts=""
          if ! git diff --quiet HEAD^1 HEAD -- floor modules roles tasks tools; then parts="What holds it"; fi
          if ! git diff --quiet HEAD^1 HEAD -- floor modules roles tasks tools scripts setup .github/workflows; then
            parts="${parts:+$parts|}What it asks of a project"
          fi
          if [ "$DRAFT" != true ]; then node scripts/pr-description.mjs "+$parts"
          elif ! node scripts/pr-description.mjs "+$parts"; then
            echo "::notice::A draft: each FAIL above is reported, not failed; it fails once the pull request is marked ready unless mended."
          fi
      - name: A pull request that changes the queue takes out the lines of closed issues (scripts/queue.mjs)
        env:
          GH_TOKEN: ${{ github.token }} # (read only: the state of each issue the queue names)
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if git diff --quiet HEAD^1 HEAD -- QUEUE.md; then echo "ok   the queue is not changed"
          elif [ "$DRAFT" != true ]; then node scripts/queue.mjs --check
          elif ! node scripts/queue.mjs --check; then
            echo "::notice::A draft: the FAIL above is reported, not failed; it fails once the pull request is marked ready unless mended."
          fi
