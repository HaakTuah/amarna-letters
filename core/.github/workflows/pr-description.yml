# The description check ("Each PR has the headings" in modules/git.md), for every project that takes the core: it fails
# a pull request whose description lacks a heading for one of its parts, "What the owner can try" and "Readings taken",
# or the parts the project names. A draft is not asked (it claims a lane and says little), nor Dependabot's own PRs
# (floor rule 17). A project calls it (workflow_call) from a workflow of its own of the same name, on pull_request
# with the types opened, edited, reopened, synchronize and ready_for_review, so that a description put right is checked
# again by itself, pinned to a full commit SHA ("How a project takes the core" in README.md, point 5). It runs the
# project's own core/scripts/pr-description.mjs on the core's one exact Node; Node's own modules only, no package
# installed. Read-only, with no secret: the description, which anyone who opens a pull request writes, reaches the
# script through env and is never written into a run line (floor rule 2).
name: pr-description

on:
  workflow_call:
    inputs:
      parts:
        description: The headings a description must have, separated by |. Left out, the core's two.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  pr-description:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' }}
    # an older run never ends after a newer one: two quick edits of a description leave the newer one's result
    concurrency:
      group: pr-description-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after the checkout needs the token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: core/.node-version # the one exact Node ("Node" in the core's modules/updates.md)
      - name: The description has its parts
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PARTS: ${{ inputs.parts }}
        run: node core/scripts/pr-description.mjs "$PARTS"
