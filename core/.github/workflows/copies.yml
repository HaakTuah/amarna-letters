# The copies check ("One fact, one place" in the core's modules/how-to-work.md), for every project that takes the core:
# a new copy of code, or of the rule files' prose, fails; the old ones its baseline lists are removed over time, and
# against the branch a PR merges into the baseline may only shrink. With it, the pointer check (every pointer in the
# rule files leads somewhere) and the reading-size check (the files every session reads keep to their marks, and a file
# past the split mark is split before it is changed), with the marks the project names; and a check that needs no
# config, the workflow check (floor rule 2: no workflow names the trigger it forbids). A project calls it
# (workflow_call) on every pull request and push to main, docs-only changes included, since the rule files are what it
# guards most, pinned to a full commit SHA ("How a project takes the core" in README.md, point 5). It runs the project's
# own core/scripts/copies.mjs, pointers.mjs, reading-size.mjs and workflows.mjs, with the configs the project names, on
# the core's one exact Node; Node's own modules only, no package installed. Read-only, with no secret.
name: copies

on:
  workflow_call:
    inputs:
      config:
        description: The copies check's config, a JSON file in the calling repository (core/scripts/copies.mjs).
        required: true
        type: string
      sizes:
        description: The reading-size check's marks, a JSON file of the caller's (core/scripts/reading-size.mjs).
        required: true
        type: string

permissions:
  contents: read

jobs:
  copies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after the checkout needs the token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: core/.node-version # the one exact Node ("Node" in the core's modules/updates.md)
      - name: The base branch's latest commit, for its baseline and marks (not the whole history)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
      - name: No new copies
        env:
          COPIES_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          CONFIG: ${{ inputs.config }}
        run: node core/scripts/copies.mjs "$CONFIG"
      - name: Every pointer in the rule files leads somewhere
        if: ${{ !cancelled() }}
        run: node core/scripts/pointers.mjs
      - name: The files every session reads keep to their marks
        if: ${{ !cancelled() }}
        env:
          SIZES_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          SIZES: ${{ inputs.sizes }}
        run: node core/scripts/reading-size.mjs "$SIZES"
      - name: No workflow names the forbidden trigger
        if: ${{ !cancelled() }}
        run: node core/scripts/workflows.mjs
