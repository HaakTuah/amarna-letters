# The versions check ("The newest stable version, unless there is a reason" in modules/updates.md): each version a
# config names is compared with its registry's (npm's or PyPI's) newest stable release old enough to take
# (scripts/versions.mjs), and each one behind gets an enhancement issue for the owner, unless one it opened is still
# open. A project calls it (workflow_call) from a monthly schedule of its own, with its config, pinned to a full commit
# SHA, from a job that grants `contents: read` and `issues: write`; the core runs it on its own schedule for the pins it
# holds (.github/versions.json). Nothing is checked out but the repository it runs for, and no untrusted text is written
# into the script: the titles and bodies pass through a file and jq. It may open issues, and nothing else.
name: versions

on:
  workflow_call:
    inputs:
      config:
        description: The versions check's config, a JSON file of the caller's (core/scripts/versions.mjs).
        required: true
        type: string
  schedule:
    - cron: "17 6 3 * *" # (the 3rd of each month, 06:17 UTC: the core's own pins)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # gh below takes its token from GH_TOKEN, nothing from the checkout
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.config && 'core/.node-version' || '.node-version' }} # the one exact Node
      - name: The versions behind (no token)
        env:
          CONFIG: ${{ inputs.config || '.github/versions.json' }}
          SCRIPT: ${{ inputs.config && 'core/scripts/versions.mjs' || 'scripts/versions.mjs' }}
        run: node "$SCRIPT" "$CONFIG" --issues > "$RUNNER_TEMP/behind.json"
      - name: An issue for each, unless one is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          behind="$RUNNER_TEMP/behind.json"
          # the issues go to the manifest's *owner's account* (core.yml checks its form); the core itself has no
          # manifest, and its own go to its repository's owner
          assignee=$( (grep -E "^\| \*owner's account\* \| \`[A-Za-z0-9-]+\` \|$" core-manifest.md 2>/dev/null || true) | head -1 | cut -d'`' -f2)
          assignee=${assignee:-$GITHUB_REPOSITORY_OWNER}
          # only the issues this workflow opened count: an outsider's idea with the same title must not silence one
          open=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&labels=enhancement&per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .title')
          for i in $(seq 0 $(( $(jq length "$behind") - 1 ))); do
            title=$(jq -r ".[$i].title" "$behind")
            if grep -qF -- "$(jq -r ".[$i].key" "$behind")" <<<"$open"; then echo "already open: $title"; continue; fi
            jq -r ".[$i].body" "$behind" > "$RUNNER_TEMP/body.md"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md" --label enhancement --assignee "$assignee"
          done
