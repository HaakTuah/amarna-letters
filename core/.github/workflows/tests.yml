        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.node == '.node-version' && (contains(matrix.parts, 'rest') || contains(matrix.parts, 'projects')) && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.base_ref }}
        shell: bash
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
      - name: No new copy in the core's own code, rule files and descriptions, and its baseline only shrinks (once, on Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.node == '.node-version' && contains(matrix.parts, 'rest') }}
        env:
          COPIES_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node scripts/copies.mjs .github/copies.json
      - name: Each choice record the change adds is argued in full, one that stood before listed (once, on Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && contains(matrix.parts, 'rest') }}
        env:
          CHOICES_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node scripts/choices.mjs
      # (a job past its mark is said as a warning, never a failure, #733, point 5)
      - name: The suites measured against their time mark
        env:
          SUITE: ${{ matrix.suite }}
        run: node scripts/shape.mjs .github/shape.json --suite "$SUITE" --since "$SUITES_START"
      # (after the time mark, which it is no part of: the faults put into the lines a pull request changes, with the
      # base fetched above; the tool stops at its budget and says what it left unrun. In the shortest job, projects and
      # sync, since in rest and steps it made that job the longest on a large change; #715. Stryker,
      # the core's mutation tool, is installed first from its own lock file at the versions it pins, with no package's
      # install scripts (floor rules 7 and 15), and its run tested with it)
      - name: Stryker, from its lock file, with no install scripts (once, on Linux)
        id: mutation
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.node == '.node-version' && contains(matrix.parts, 'projects') && github.event_name == 'pull_request' }}
        shell: bash
        run: node scripts/install.mjs mutation # (its lock file, package list and .npmrc refused before npm runs where they could reach past npm's registry, as each install's are)
      - name: Stryker's packages, the registry's signature on each (once, on Linux)
        if: ${{ !cancelled() && steps.mutation.outcome == 'success' && runner.os == 'Linux' && matrix.node == '.node-version' && contains(matrix.parts, 'projects') && github.event_name == 'pull_request' }}
        working-directory: tests/mutation
        shell: bash
        run: npm audit signatures --prefix=. # (only where the install passed, as the core's other installs' are checked, floor rule 7)
      - name: Stryker's run as a mutation tool, with Stryker itself (once, on Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.node == '.node-version' && contains(matrix.parts, 'projects') && github.event_name == 'pull_request' && (env.RUN == 'all' || contains(env.RUN, ' tests/stryker-test.mjs ')) }}
        run: node tests/stryker-test.mjs --tool tests/mutation
      - name: How strong the tests are, on the lines the pull request changes (once, on Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.node == '.node-version' && contains(matrix.parts, 'projects') && github.event_name == 'pull_request' }}
        env:
          STRENGTH_BASE: origin/${{ github.base_ref }}
          MUTATE_BUDGET: "240"
        run: node scripts/strength.mjs

  # (on Linux the upgrade test runs in two jobs side by side, each a part of it under the test's time mark: the older
  # of the two releases with the copy older than the first, and the newer release; on Windows it runs in the release
  # workflow alone, daily and before each release, and three jobs there run the staged cases' test alone (#715). It
  # runs in thirds, each under the suite's own mark: on Windows a job each, since in halves the longer took 805 s of
  # its 900 and set the pull request's time; on Linux the three one after another in a job of their own, each under
  # the mark, since after the upgrade test's parts they made those jobs the longest; #304, #508, #515, #715)
  upgrade:
    name: ${{ (matrix.os == 'windows-latest' || matrix.part == 'staged') && 'staged' || 'upgrade' }} (${{ matrix.os }}, ${{ matrix.part }})
    needs: [moved, pick]
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && github.event.pull_request.draft) && (github.event_name != 'schedule' || needs.moved.outputs.run == 'true') && (github.event_name != 'workflow_dispatch' || inputs.only == '' || needs.pick.result == 'success' && needs.pick.outputs.upgrade != '[]') }}
    strategy:
      fail-fast: false
      # (as the suites: on a pull request and a push the three on Linux, on the hourly run the three on Windows, on a
      # start by hand all six, or those of them the parts named pick; #733, points 3 and 6; #954)
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push') && '[{"os":"ubuntu-latest","part":"older"},{"os":"ubuntu-latest","part":"newer"},{"os":"ubuntu-latest","part":"staged"}]' || github.event_name == 'schedule' && '[{"os":"windows-latest","part":"older"},{"os":"windows-latest","part":"newer"},{"os":"windows-latest","part":"third"}]' || inputs.only != '' && needs.pick.outputs.upgrade || '[{"os":"ubuntu-latest","part":"older"},{"os":"ubuntu-latest","part":"newer"},{"os":"ubuntu-latest","part":"staged"},{"os":"windows-latest","part":"older"},{"os":"windows-latest","part":"newer"},{"os":"windows-latest","part":"third"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the history and the release tags: the last two releases, for the upgrade test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: The core's packages, installed from its lock files for the upgrade test, the parser's among them (#654, #719)
        run: node scripts/install.mjs all
      - name: The tests this change can reach (on main, and in a re-run, every one)
        env:
          SELECT_BASE: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && 'HEAD^1' || '' }}
        run: node scripts/select.mjs .github/shape.json --env RUN
      - name: A project of each of the last two releases, or of the one this job's part names, synced to this commit, passes every check unchanged (on Linux; on Windows, the release workflow)
        if: ${{ runner.os == 'Linux' && matrix.part != 'staged' && (env.RUN == 'all' || contains(env.RUN, ' tests/upgrade-test.mjs ')) }}
        env:
          PART: ${{ matrix.part }}
        run: node scripts/shape.mjs .github/shape.json --suite upgrade -- node tests/upgrade-test.mjs --part "$PART"
      # (here, not in the suites: a scratch project each, which on Windows would run the suites past their time; a third
      # each, a job of its own on Windows, and on Linux the first, then the second and third, each under the mark, in the
      # job "staged"; none after the upgrade test's parts; #715)
      - name: The staged cases, each read as set, kept and broken; what is due, and when they hold a release
        if: ${{ !cancelled() && (runner.os != 'Linux' || matrix.part == 'staged') && (env.RUN == 'all' || contains(env.RUN, ' tests/staged-test.mjs ')) }}
        env:
          STAGED: ${{ matrix.part == 'staged' && 'first second,third' || matrix.part == 'older' && 'first' || matrix.part == 'newer' && 'second' || matrix.part == 'third' && 'third' || 'all' }}
        run: | # (each part its own run and its own measure, words of the matrix's alone; every part runs though one failed)
          failed=0
          for part in $STAGED; do node scripts/shape.mjs .github/shape.json --suite staged -- node tests/staged-test.mjs --part "$part" || failed=1; done
          exit "$failed"

  # (the one check the ruleset asks for by name: it passes only where the suites, the staged cases and the upgrade test
  # on Linux passed that the run started, on Windows too where it started them; a job that ran out of its time is
  # cancelled, which no failing test is, so the gate says which it was. On a draft it runs and fails, since a check the
  # ruleset requires passes where its job is skipped, and a draft's head is tested only once it is marked ready; on an
  # hourly run where main did not move it is skipped, which only ever follows a full run that passed, so a release reads
  # it as that pass. Where a run of main, the hour or a hand is cancelled whole, it stands aside, so the commit reads
  # cancelled and never failed, #810; a pull request's always runs, since a skipped one would pass a run cancelled by
  # hand or by merge-line.mjs --cancel. A start by hand that names parts names its gate apart, so its pass never stands for
  # the check the ruleset asks for, nor for the pass a push's selection reads on a merged head, #954; it passes where the
  # jobs picked passed, a group none of whose jobs was picked standing skipped)
  tests:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.only != '' && 'tests, only the parts named' || 'tests' }}
    needs: [moved, pick, suites, upgrade]
    if: ${{ (github.event_name == 'pull_request' && always() || !cancelled()) && (github.event_name != 'schedule' || needs.moved.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The suites, the staged cases and the upgrade test this run started passed
        env:
          SUITES: ${{ needs.suites.result }}
          UPGRADE: ${{ needs.upgrade.result }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'yes' || '' }}
          PICKED: ${{ github.event_name == 'workflow_dispatch' && inputs.only != '' && needs.pick.result || '' }}
          NO_SUITES: ${{ needs.pick.outputs.suites == '[]' && 'yes' || '' }}
          NO_UPGRADE: ${{ needs.pick.outputs.upgrade == '[]' && 'yes' || '' }}
        run: |
          if [ -n "$DRAFT" ]; then
            echo "::error::a draft is not tested here (#733, point 2), so this check stands failed on its head. Mend: run the" \
              "suites the change reaches in your own working copy, then mark the pull request ready, which starts this run again"
            exit 1
          fi
          if [ -n "$PICKED" ] && [ "$PICKED" != success ]; then
            echo "::error::the parts this start by hand named were not picked ($PICKED), so no job ran. Mend: read the job pick," \
              "whose failure says its own mend, and start the run again naming parts it lists"
            exit 1
          fi
          if [ -n "$PICKED" ]; then
            if [ -n "$NO_SUITES" ] && [ "$SUITES" = skipped ]; then SUITES=success; fi
            if [ -n "$NO_UPGRADE" ] && [ "$UPGRADE" = skipped ]; then UPGRADE=success; fi
          fi
          echo "the suites: $SUITES; the upgrade test and the staged cases: $UPGRADE"
          if [ "$SUITES" = cancelled ] || [ "$UPGRADE" = cancelled ]; then
            echo "::error::a job was cancelled: it ran out of its time (timeout-minutes) or was stopped, which is no" \
              "failing test. Mend: read its log for the step it stood in, and re-run the job once"
            exit 1
          fi
          if [ "$SUITES" != success ] || [ "$UPGRADE" != success ]; then
            echo "::error::a suite, the upgrade test or a staged case failed. Mend: read the failing job above, whose" \
              "failing line says its own mend, and fix that in this pull request"
            exit 1
          fi
