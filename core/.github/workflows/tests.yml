# The core's scripts' own tests, and its own licence audit, on every pull request here and every push to main, on Linux
# and on Windows, where a project built there runs the scripts and both hooks (in Git Bash, as Claude Code does). Every
# suite runs though another failed, so one run shows them all. This repository only; no project calls it. Reads only,
# with no secret, on the core's one exact Node; nothing is installed. One suite writes and builds a .NET project with
# the .NET SDK the runner holds, in a scratch folder, and takes a few packages from nuget.org for it
# (scripts/init-dotnet-test.mjs). Another writes projects with the starter kit of each of the last two releases, syncs
# them to the commit under test and runs every check of the core on them, taking one package from npm's registry
# (scripts/upgrade-test.mjs): it reads the core's whole history and its release tags, so the checkout fetches them.
# A third takes four packages from npm's registry, each at one exact version and held to its sha512 before it is
# unpacked, with no script of theirs run: the reference parsers the hand-written readers are held to, tools that only
# run, in the core's audit (scripts/readers-test.mjs, on Linux).
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the history and the release tags: the last two releases, for the upgrade test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: The versions check
        run: node scripts/versions-test.mjs
      - name: The licence check's lists and readers
        if: ${{ !cancelled() }}
        run: node scripts/licences-test.mjs
      - name: The licence check on a whole project, and its scan
        if: ${{ !cancelled() }}
        run: node scripts/licence-scan-test.mjs
      - name: The licence scan on every form of a fetch
        if: ${{ !cancelled() }}
        run: node scripts/licence-fetch-test.mjs
      - name: The licences read back from the installed packages
        if: ${{ !cancelled() }}
        run: node scripts/licence-installed-test.mjs
      - name: The NuGet check
        if: ${{ !cancelled() }}
        run: node scripts/nuget-test.mjs
      - name: The NuGet check's fetch before the restore, against each package's content hash
        if: ${{ !cancelled() }}
        run: node scripts/nuget-fetch-test.mjs
      - name: The hand-written readers, against SPDX's own parser and an XML parser (once, on Linux, where tar unpacks them)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: node scripts/readers-test.mjs
      - name: The exact-versions check
        if: ${{ !cancelled() }}
        run: node scripts/exact-versions-test.mjs
      - name: The helper hook
        if: ${{ !cancelled() }}
        run: node scripts/helper-call-test.mjs
      - name: The work-saved hook
        if: ${{ !cancelled() }}
        run: node scripts/work-saved-test.mjs
      - name: The session's cost line
        if: ${{ !cancelled() }}
        run: node scripts/session-cost-test.mjs
      - name: The core's own measurement
        if: ${{ !cancelled() }}
        run: node scripts/core-cost-test.mjs
      - name: The stand-in's record
        if: ${{ !cancelled() }}
        run: node scripts/stand-in-record-test.mjs
      - name: The stalled lanes
        if: ${{ !cancelled() }}
        run: node scripts/stalled-test.mjs
      - name: The description check
        if: ${{ !cancelled() }}
        run: node scripts/pr-description-test.mjs
      - name: The security-review check
        if: ${{ !cancelled() }}
        run: node scripts/security-review-test.mjs
      - name: The workflow check
        if: ${{ !cancelled() }}
        run: node scripts/workflows-test.mjs
      - name: The core-moved check
        if: ${{ !cancelled() }}
        run: node scripts/core-moved-test.mjs
      - name: The core's releases, what a project follows, and cutting one
        if: ${{ !cancelled() }}
        run: node scripts/releases-test.mjs
      - name: The core's address stands in one place, and is this repository's
        if: ${{ !cancelled() }}
        run: node scripts/core-address-test.mjs
      - name: The tree a copy must be
        if: ${{ !cancelled() }}
        run: node scripts/copy-tree-test.mjs
      - name: The copy of the core's check (core.yml), its own job on scratch projects
        if: ${{ !cancelled() }}
        run: node scripts/core-yml-test.mjs
      - name: The sync, and the proof that a sync is pure, against every way a sync branch can carry more
        if: ${{ !cancelled() }}
        run: node scripts/pure-sync-test.mjs
      - name: The proof that a change to what runs by itself is only comments and steps' names
        if: ${{ !cancelled() }}
        run: node scripts/comment-only-test.mjs
      - name: Whether a script was started by itself
        if: ${{ !cancelled() }}
        run: node scripts/started-test.mjs
      - name: The starter kit, and the core's own checks on a project it writes
        if: ${{ !cancelled() }}
        run: node scripts/init-test.mjs
      - name: The starter kit on a .NET project, cloned as Windows clones it, and built
        if: ${{ !cancelled() }}
        run: node scripts/init-dotnet-test.mjs
      - name: A project of each of the last two releases, synced to this commit, passes every check unchanged
        if: ${{ !cancelled() }}
        run: node scripts/upgrade-test.mjs
      - name: The NuGet check's own steps, its first look and its whole job
        if: ${{ !cancelled() }}
        run: node scripts/nuget-gate-test.mjs
      - name: The personal-terms check, its own job on scratch pull requests
        if: ${{ !cancelled() }}
        run: node scripts/personal-terms-test.mjs
      - name: The words check, the dated records' added lines too
        if: ${{ !cancelled() }}
        run: node scripts/general-test.mjs
      - name: The cap's own check
        if: ${{ !cancelled() }}
        run: node scripts/size-test.mjs
      - name: The pointer check
        if: ${{ !cancelled() }}
        run: node scripts/pointers-test.mjs
      - name: The pointers in the core's own floor and modules lead somewhere
        if: ${{ !cancelled() }}
        run: node scripts/pointers.mjs --core
      - name: None of the core's own workflows names the forbidden trigger
        if: ${{ !cancelled() }}
        run: node scripts/workflows.mjs
      - name: What the core's own workflows and scripts use, each to its list
        if: ${{ !cancelled() }}
        run: node scripts/licences.mjs .github/licences.json

  # (the one check the ruleset asks for by name: it passes only where the suites passed on both)
  tests:
    needs: suites
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The suites passed on Linux and on Windows
        env:
          RESULT: ${{ needs.suites.result }}
        run: |
          echo "the suites: $RESULT"; [ "$RESULT" = success ]
