# The core's scripts' own tests, and its own licence audit and copies check, on Linux and on Windows, where a project
# built there runs the scripts and both hooks (in Git Bash, as Claude Code does). When each runs (#733): on a pull
# request once it is marked ready and on each push after, never on a draft, on Linux alone, the suites its change can
# reach; on each push to main, on Linux, main tested at its newest commit, a run that has started finishing and only a
# waiting one giving way to the next merge's (#810); once an hour, on Windows, at main's newest commit where its full
# run has not already passed there, with the tests that reach the network on both, which no pull request's run or push's
# carries (tasks/tests.md, "A test that reaches the network runs once per batch"; #733, point 9); and in full on both,
# on a start by hand that names no part, or, where it names parts and systems in its input "only", their jobs alone,
# named "tests, only" and those words, its gate too, so it is never read as a full run nor as a pull request's check
# (scripts/tests-parts.mjs; #954). A release waits on the tests' full runs on its commit, hourly or by hand: none
# unfinished, the newest passed (.github/workflows/release.yml,
# scripts/release.mjs). Every suite runs though another failed, so one run shows them all. This repository only; no project calls it. Reads only, with no secret; nothing is installed but the
# core's own packages, below. The suites run on the core's one exact Node, the pin
# (.node-version), and on the least long-term Node its scripts promise to run on (.node-least, which scripts/node.sh
# keeps on a machine that holds it; #526); the upgrade test and the staged cases on the pin alone. One suite writes and
# builds a .NET project with the .NET SDK the runner holds, in a scratch folder, and takes a few packages from nuget.org
# for it (tests/init-dotnet-test.mjs). Another writes projects with the starter kit of each of the last two releases,
# syncs them to the commit under test and runs every check of the core on them, taking one package from npm's registry
# (tests/upgrade-test.mjs): it reads the core's whole history and its release tags, so its checkout fetches them, and it
# runs in two jobs of its own, a part of it each, beside the suites, here on Linux alone; on Windows, where it set the
# length of every run, the release workflow runs it once a day and before each release (#715), since what it guards
# reaches a project only through a release. The staged cases' test, which writes a scratch project with the starter kit
# for each case it reads, runs in thirds: on Linux one after another in a job of their own beside the upgrade test's,
# and on Windows in three jobs of the same name (#508, #715).
# A third runs the reference parsers the hand-written readers are held to, tools that only run, the devDependencies of
# the core's lock file, which its own jobs install and a copy does not (tests/readers-test.mjs, on Linux).
# Each job first installs the core's own packages from its lock files in .packages/, the parser's in .packages/parser/
# among them (#719), from npm's registry, running no install script (scripts/install.mjs; #654), and a fourth holds that install: its lock file's form, nothing of another publisher's
# tracked, and each script that loads a package saying it did not run where none is installed (tests/packages-test.mjs).
# Once, on Linux, the core's own lock files are held as a project's are: each package it brings looked up in npm's
# registry (scripts/lookup.mjs), the week's wait on each one a change brings or updates (scripts/week-wait.mjs), and the
# registry's signature on each installed one (npm audit signatures); the
# mutation tool's in tests/mutation/ in the job that installs it, the step after its install.
# Each job of the suites, three on Linux and fifteen on Windows on each Node, the network's on both, and the upgrade
# test, are measured against a time mark (the "suites" of .github/shape.json, by scripts/shape.mjs), which a job past
# it says as a warning and never fails on (tasks/tests.md, "A time mark measures and never fails"; #733, point 5).
# On a pull request each job runs only the suites its change can reach, against the merge's first parent, its base, and
# says on its summary what it ran; a push to main, the hourly run, a start by hand and a re-run run every suite
# (scripts/select.mjs; tasks/tests.md, "A pull request runs the tests its change can reach"), but a push's first run
# that merges a pull request's head whose tree it holds, whose change selected every suite and whose check "tests"
# passed there runs none of the suites that pull request ran (select.mjs --passed, which asks GitHub of that check with
# the run's token, given to it on a push alone, that token reading checks besides the contents; tasks/tests.md, "A tree
# that passed is not run again"; #457); the upgrade test and the staged cases, which read the release tags and the day,
# never in the tree, run on every push; and the checks of the core itself, each a step of its own after the suites, run
# every time.
# After them, on Linux, in the job of the suites projects and sync on the pin, the core's mutation tool, Stryker, installed
# there from its own lock file in tests/mutation/, puts faults into the lines a pull request changes and runs the tests
# that name each file against them (scripts/strength.mjs with scripts/stryker.mjs; tasks/code-shape.md, "How strong the
# tests are"), in a working copy of its own, with no secret.
name: tests
# (a start by hand that names parts, by that name; any other run by GitHub's own, which an empty name leaves)
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.only != '' && format('tests, only {0}', inputs.only) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      only:
        description: "Empty: the tests in full, on both systems. Else the jobs to run alone, by words: a system (linux, windows) and parts (projects, sync, converge, hostile, kit, fresh, steps, writes, core, faults, places, terms, licences, scans, packages, tools, network, rest, second, third, upgrade, staged), such as: windows kit"
        type: string
        default: ''
        required: false

permissions:
  contents: read

# (a pull request's run gives way to a newer one for the same pull request, whose head it no longer is, #388; a run on
# main after a merge that has started finishes, and of the merges' runs waiting behind it only the newest is kept, so one
# run covers every merge that landed meanwhile, #733, point 4, as #810 changed it; the hourly runs are one group that
# waits rather than cancels, so a long one finishes and the next, on the same commit, skips itself where it passed; a
# start by hand is a group of its own and never cancelled)
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' || github.event_name == 'schedule') && format('{0}-main', github.event_name) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # (the hourly run tests main's newest commit on Windows only where main moved: it skips only where no other full run
  # on this commit, hourly or by hand, is still going and the newest of them, by when it last started (a re-run moves it),
  # passed; where one failed, none ran or one still runs, it runs. A skipped run is then the newest only where nothing
  # started after it,
  # and the release, which holds while any full run is unfinished and reads the newest (release.mjs, fullRun), never
  # reads a failure away; where that cannot be read, it runs; #733, point 6)
  moved:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      run: ${{ steps.moved.outputs.run }}
    steps:
      - name: Whether main moved since the tests last passed on it in full
        id: moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (every page of them, so a re-run of an older one is read however many stand there; a page that cannot be
          # read leaves the answer empty, and the run happens; a start by hand is a full run by the workflow's own name,
          # never one that named parts, and one by another name only where it did not pass, #954)
          list=$(mktemp) done=""
          if gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs" -f head_sha="$GITHUB_SHA" -f branch=main -F per_page=100 --jq '.workflow_runs[] | select((.event == "schedule" or (.event == "workflow_dispatch" and (.display_title == "tests" or (.conclusion != "success" and ((.display_title // "") | startswith("tests, only ") | not))))) and ((.id | tostring) != env.GITHUB_RUN_ID))' > "$list"; then
            done=$(jq -rs 'if any(.[]; .status != "completed") then "running" else (sort_by([.run_started_at // "", .id]) | last | .conclusion // "none") end' "$list" || true)
          fi
          echo "the full runs on $GITHUB_SHA, hourly or by hand, but this one: ${done:-not read} (the newest, or running where one still is)"
          if [ "$done" = success ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  # (a start by hand that names parts: the jobs of the full run it picks, read from the last list of each job's matrix
  # below, which a start by hand that names none runs whole; #954)
  pick:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.only != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
      upgrade: ${{ steps.pick.outputs.upgrade }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: The jobs the parts named take
        id: pick
        env:
          ONLY: ${{ inputs.only }}
        run: node scripts/tests-parts.mjs "$ONLY" --output "$GITHUB_OUTPUT"

  # (the suites are split in parts that run side by side, each under a time mark of its own. Each part is a word of the
  # jobs' list "parts", which each step's condition names, read by substring: no name holds another, but that core is
  # named beside its half. The parts: the core's checks from plain git on whole scratch projects (projects); the hostile
  # tests of the core's inputs and what the checks leave out for the copy (hostile); the sync's proof (sync); the one
  # process and each writer's round trip (converge); the starter kit (kit) and the steps' tests on a fresh start (fresh),
  # the rest of the steps' tests in two (steps, writes); the check of the core's copy (core.yml) on scratch projects
  # (core), on Windows in two halves of its test, the faults it names and where the copy stands (faults, places); the
  # personal-terms check's own job (terms); the NuGet check's own steps with the checks of the core's own packages and tools list (licences); the licence, lookup and scan checks,
  # with the hostile tests of build files and packages (scans); the core's packages from its lock file (packages); the
  # agent-tools check (tools), on Windows alone, since its cases outgrew the licences' mark there (#603); the tests that
  # reach the network, in a job of their own on each system once an hour (network); and the rest, in three (rest,
  # second, third). On Windows, where a suite that starts many processes runs several times slower, a job takes each of
  # these alone but kit with fresh, core with faults, core with places and terms, and tools with packages; on Linux
  # three jobs take them all: kit, core, licences, terms, tools, scans and packages in one; projects, sync, converge and
  # hostile in the second, which keeps the name of the suite that was whole and so its mark, lowered; and rest, steps,
  # fresh, writes, second and third, the steps run once on Linux, in the third (#529). Each part is sized by its steps'
  # times on the slow runner, which takes half as long again as another, so that it ends within its mark there too, no
  # mark raised, and well within the job's limit: on Windows, by a run of every part on both Nodes (run 45339915083, #1213),
  # the longer of the two, of 600 (projects) 481, of 300 (sync) 228 and (hostile) 164, of 600 (kit with fresh) 488, of
  # 450 (converge) 239, (steps) 352, (writes) 354, (core with faults) 95, (core with places and terms) 380, (licences)
  # 329, (scans) 329 and (tools with packages) 280, and the rest's three of 480, 325, 369 and 253 seconds (a part with a
  # test failing for another cause may end early, so the figures of such a part are read again when it passes).
  # Beside them the upgrade job, which takes longer; #387, #405, #411, #424, #425, #489, #504, #540, #514, #1213)
  suites:
    name: suites (${{ matrix.os }}, ${{ matrix.parts }}${{ matrix.node == '.node-least' && ', the least Node' || '' }})
    needs: [moved, pick]
    # (no run on a draft, #733, point 2; the hourly one only where main moved; a start by hand that names parts only
    # where they were picked and take a job here, #954)
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && github.event.pull_request.draft) && (github.event_name != 'schedule' || needs.moved.outputs.run == 'true') && (github.event_name != 'workflow_dispatch' || inputs.only == '' || needs.pick.result == 'success' && needs.pick.outputs.suites != '[]') }}
    strategy:
      fail-fast: false
      # (each job on the pin and on the least long-term Node, the file setup-node reads, #526; on a pull request and a
      # push to main the three on Linux alone, on the hourly run the fifteen on Windows and the network's on both, and on
      # a start by hand all of them, the last list, or those of it the parts named pick; #733, points 3, 6 and 9; #954)
      # (set whole for each event, since GitHub adds back an entry of `include` that matches no combination left after
      # `exclude`: each job named with its Node, its suite, its runner and its parts)
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push') && '[{"node":".node-version","suite":"suites-kit-core-licences","os":"ubuntu-latest","parts":"kit core licences terms tools scans packages"},{"node":".node-version","suite":"suites","os":"ubuntu-latest","parts":"projects sync converge hostile"},{"node":".node-version","suite":"suites-rest-steps","os":"ubuntu-latest","parts":"rest steps fresh writes second third"},{"node":".node-least","suite":"suites-kit-core-licences","os":"ubuntu-latest","parts":"kit core licences terms tools scans packages"},{"node":".node-least","suite":"suites","os":"ubuntu-latest","parts":"projects sync converge hostile"},{"node":".node-least","suite":"suites-rest-steps","os":"ubuntu-latest","parts":"rest steps fresh writes second third"}]' || github.event_name == 'schedule' && '[{"node":".node-version","suite":"suites-projects","os":"windows-latest","parts":"projects"},{"node":".node-version","suite":"suites-sync","os":"windows-latest","parts":"sync"},{"node":".node-version","suite":"suites-converge","os":"windows-latest","parts":"converge"},{"node":".node-version","suite":"suites-hostile","os":"windows-latest","parts":"hostile"},{"node":".node-version","suite":"suites-kit","os":"windows-latest","parts":"kit fresh"},{"node":".node-version","suite":"suites-steps","os":"windows-latest","parts":"steps"},{"node":".node-version","suite":"suites-writes","os":"windows-latest","parts":"writes"},{"node":".node-version","suite":"suites-core","os":"windows-latest","parts":"core faults"},{"node":".node-version","suite":"suites-core-places","os":"windows-latest","parts":"core places terms"},{"node":".node-version","suite":"suites-licences","os":"windows-latest","parts":"licences"},{"node":".node-version","suite":"suites-scans","os":"windows-latest","parts":"scans"},{"node":".node-version","suite":"suites-rest","os":"windows-latest","parts":"rest"},{"node":".node-version","suite":"suites-rest-two","os":"windows-latest","parts":"second"},{"node":".node-version","suite":"suites-rest-three","os":"windows-latest","parts":"third"},{"node":".node-version","suite":"suites-tools","os":"windows-latest","parts":"tools packages"},{"node":".node-version","suite":"suites-network","os":"ubuntu-latest","parts":"network"},{"node":".node-version","suite":"suites-network","os":"windows-latest","parts":"network"},{"node":".node-least","suite":"suites-projects","os":"windows-latest","parts":"projects"},{"node":".node-least","suite":"suites-sync","os":"windows-latest","parts":"sync"},{"node":".node-least","suite":"suites-converge","os":"windows-latest","parts":"converge"},{"node":".node-least","suite":"suites-hostile","os":"windows-latest","parts":"hostile"},{"node":".node-least","suite":"suites-kit","os":"windows-latest","parts":"kit fresh"},{"node":".node-least","suite":"suites-steps","os":"windows-latest","parts":"steps"},{"node":".node-least","suite":"suites-writes","os":"windows-latest","parts":"writes"},{"node":".node-least","suite":"suites-core","os":"windows-latest","parts":"core faults"},{"node":".node-least","suite":"suites-core-places","os":"windows-latest","parts":"core places terms"},{"node":".node-least","suite":"suites-licences","os":"windows-latest","parts":"licences"},{"node":".node-least","suite":"suites-scans","os":"windows-latest","parts":"scans"},{"node":".node-least","suite":"suites-rest","os":"windows-latest","parts":"rest"},{"node":".node-least","suite":"suites-rest-two","os":"windows-latest","parts":"second"},{"node":".node-least","suite":"suites-rest-three","os":"windows-latest","parts":"third"},{"node":".node-least","suite":"suites-tools","os":"windows-latest","parts":"tools packages"},{"node":".node-least","suite":"suites-network","os":"ubuntu-latest","parts":"network"},{"node":".node-least","suite":"suites-network","os":"windows-latest","parts":"network"}]' || inputs.only != '' && needs.pick.outputs.suites || '[{"node":".node-version","suite":"suites-kit-core-licences","os":"ubuntu-latest","parts":"kit core licences terms tools scans packages"},{"node":".node-version","suite":"suites","os":"ubuntu-latest","parts":"projects sync converge hostile"},{"node":".node-version","suite":"suites-rest-steps","os":"ubuntu-latest","parts":"rest steps fresh writes second third"},{"node":".node-version","suite":"suites-projects","os":"windows-latest","parts":"projects"},{"node":".node-version","suite":"suites-sync","os":"windows-latest","parts":"sync"},{"node":".node-version","suite":"suites-converge","os":"windows-latest","parts":"converge"},{"node":".node-version","suite":"suites-hostile","os":"windows-latest","parts":"hostile"},{"node":".node-version","suite":"suites-kit","os":"windows-latest","parts":"kit fresh"},{"node":".node-version","suite":"suites-steps","os":"windows-latest","parts":"steps"},{"node":".node-version","suite":"suites-writes","os":"windows-latest","parts":"writes"},{"node":".node-version","suite":"suites-core","os":"windows-latest","parts":"core faults"},{"node":".node-version","suite":"suites-core-places","os":"windows-latest","parts":"core places terms"},{"node":".node-version","suite":"suites-licences","os":"windows-latest","parts":"licences"},{"node":".node-version","suite":"suites-scans","os":"windows-latest","parts":"scans"},{"node":".node-version","suite":"suites-rest","os":"windows-latest","parts":"rest"},{"node":".node-version","suite":"suites-rest-two","os":"windows-latest","parts":"second"},{"node":".node-version","suite":"suites-rest-three","os":"windows-latest","parts":"third"},{"node":".node-version","suite":"suites-tools","os":"windows-latest","parts":"tools packages"},{"node":".node-version","suite":"suites-network","os":"ubuntu-latest","parts":"network"},{"node":".node-version","suite":"suites-network","os":"windows-latest","parts":"network"},{"node":".node-least","suite":"suites-kit-core-licences","os":"ubuntu-latest","parts":"kit core licences terms tools scans packages"},{"node":".node-least","suite":"suites","os":"ubuntu-latest","parts":"projects sync converge hostile"},{"node":".node-least","suite":"suites-rest-steps","os":"ubuntu-latest","parts":"rest steps fresh writes second third"},{"node":".node-least","suite":"suites-projects","os":"windows-latest","parts":"projects"},{"node":".node-least","suite":"suites-sync","os":"windows-latest","parts":"sync"},{"node":".node-least","suite":"suites-converge","os":"windows-latest","parts":"converge"},{"node":".node-least","suite":"suites-hostile","os":"windows-latest","parts":"hostile"},{"node":".node-least","suite":"suites-kit","os":"windows-latest","parts":"kit fresh"},{"node":".node-least","suite":"suites-steps","os":"windows-latest","parts":"steps"},{"node":".node-least","suite":"suites-writes","os":"windows-latest","parts":"writes"},{"node":".node-least","suite":"suites-core","os":"windows-latest","parts":"core faults"},{"node":".node-least","suite":"suites-core-places","os":"windows-latest","parts":"core places terms"},{"node":".node-least","suite":"suites-licences","os":"windows-latest","parts":"licences"},{"node":".node-least","suite":"suites-scans","os":"windows-latest","parts":"scans"},{"node":".node-least","suite":"suites-rest","os":"windows-latest","parts":"rest"},{"node":".node-least","suite":"suites-rest-two","os":"windows-latest","parts":"second"},{"node":".node-least","suite":"suites-rest-three","os":"windows-latest","parts":"third"},{"node":".node-least","suite":"suites-tools","os":"windows-latest","parts":"tools packages"},{"node":".node-least","suite":"suites-network","os":"ubuntu-latest","parts":"network"},{"node":".node-least","suite":"suites-network","os":"windows-latest","parts":"network"}]') }}
    # (the run's token reads the checks too: the selection asks whether "tests" passed on the merged head, on a push)
    permissions:
      contents: read
      checks: read
    runs-on: ${{ matrix.os }}
    # (15 minutes, but 22 for the one job that also runs the strength check on a pull request, the condition its steps
    # name below: its suites take about 10.5 minutes, Stryker's set-up about 30 seconds and the check its whole budget,
    # 240, so at 15 it stood within seconds of its limit and was cancelled with every step passed; 22 holds it on a
    # runner half again as slow, as #232 and #387 gave the Windows jobs room; #1291)
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '.node-version' && contains(matrix.parts, 'projects') && github.event_name == 'pull_request' && 22 || 15 }}
    # (on Linux, but in the part network, each step runs with the network cut off, loopback still up, so a test that
    # reaches it fails there, saying its mend where its output shows the fetch refused, or stalls until its time runs
    # out; a step that must reach it names its own shell, bash, and
    # tests/workflows-test.mjs holds which those are: the installs, the tools' fetches, the selection, the registry's
    # lookups and the base's fetch, the week's wait on each new package, and the fetches of the code scan's wheels and of
    # Betterleaks' archive for their tests; scripts/offline.sh; #770, #772)
    defaults:
      run:
        shell: ${{ matrix.os == 'ubuntu-latest' && matrix.parts != 'network' && format('bash {0}/scripts/offline.sh {{0}}', github.workspace) || 'bash' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the merge a pull request's run checks out, and its base, for the selection
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ matrix.node }}
      - name: The core's packages, installed from its lock files for the suites, the parser's among them (#654, #719)
        id: install
        shell: bash
        run: node scripts/install.mjs all
      - name: zizmor and actionlint, which the workflow check and its test run, fetched at their pins outside the repository (scripts/workflow-tools.sh; #580)
        if: ${{ contains(matrix.parts, 'second') || contains(matrix.parts, 'third') }}
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        run: bash scripts/workflow-tools.sh >> "$GITHUB_ENV"
      - name: lychee, which the pointer check runs, fetched at its pin outside the repository (scripts/lychee.sh; #582)
        if: ${{ contains(matrix.parts, 'third') }}
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        run: bash scripts/lychee.sh >> "$GITHUB_ENV"
      - name: The suites this change can reach (on main, and in a re-run, every one, but none where the merged head passed this tree whole)
        env:
          SELECT_BASE: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && 'HEAD^1' || '' }}
          # (on a push's first run, whose jobs a pull request also runs, all on Linux: the check whose pass on the merged
          # head, whose tree this push holds, lets the suites select nothing; #457)
          SELECT_PASSED: ${{ github.event_name == 'push' && github.run_attempt == 1 && 'tests' || '' }}
          GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        shell: bash
        run: node scripts/select.mjs .github/shape.json --env RUN ${SELECT_PASSED:+--passed "$SELECT_PASSED"}
      # (what the tests below need while the network is cut off, fetched while it is up by scripts/test-downloads.sh, a
      # script of its own, as the tools' fetches are, at the pins its header names: the wheels of the code scan's engine, and
      # Betterleaks' archive for the personal-terms check's tests; #772)
      - name: The code scan's engine, its wheels fetched at their pins for its test (Linux, where the suites run with the network cut off)
        if: ${{ runner.os == 'Linux' && contains(matrix.parts, 'scans') && (env.RUN == 'all' || contains(env.RUN, ' tests/code-scan-test.mjs ')) }}
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-downloads.sh wheels >> "$GITHUB_ENV"
      - name: Betterleaks' release, its archive fetched at the check's pin for the tests of the personal-terms check (Linux, where the suites run with the network cut off)
        if: ${{ runner.os == 'Linux' && runner.arch == 'X64' && (contains(matrix.parts, 'terms') || contains(matrix.parts, 'hostile')) && (env.RUN == 'all' || contains(env.RUN, ' tests/personal-terms-test.mjs ') || contains(env.RUN, ' tests/copy-left-out-test.mjs ')) }}
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-downloads.sh archives >> "$GITHUB_ENV"
      # (only the parts projects and hostile: the system's temp folder, a short name under the home folder on another drive
      # than the checkout, is what the other Windows parts still test their scripts against; #882)
      - name: Scratch folders of the parts projects and hostile on the runner's own drive, where git writes a tree three times faster than under the system's temp folder (#951)
        if: ${{ runner.os == 'Windows' && (contains(matrix.parts, 'projects') || contains(matrix.parts, 'hostile')) }}
        run: echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV" && echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: The second the suites start at, for their time mark
        run: echo "SUITES_START=$(date +%s)" >> "$GITHUB_ENV"
