# The signature check (floor rule 7: "the registry's signature verified"), for a project whose packages come from npm:
# it installs from the lock file, from npm's registry alone and running no package's install script, and then runs
# npm's own `npm audit signatures`, which fails where the registry's copy of an installed name and version has no valid
# signature, or a provenance that does not hold. npm's own tool on npm's own data. Then, with the packages installed,
# the caller's own core/scripts/licence-installed.mjs holds each lock entry's licence and version to what the installed
# package says of itself (floor rule 10), so that the licence check, which reads the lock file, reads what the
# packages say; it runs nothing of what it reads. The install refuses a package from git, from a web address or from a tarball file, which the signature check
# would pass over in silence (npm 11.20, which the core's Node brings, knows these settings; given on the command line,
# they overrule an `.npmrc`). An `.npmrc` that names another registry, or sets anything else that changes where npm
# fetches from, already fails the licence check (scripts/licences.mjs), which is why no registry is named here.
# What it does not hold: that a lock entry which names one registry package resolves to that package and not another
# of the registry's, and the rest of rule 7's source check (the same publisher and repository, a provenance kept where
# the old version had one, the diff read against the release notes): those stay with the reviews, which read the lock
# file's diff. A project calls it (workflow_call) from a workflow of its own of the same name, on every pull request,
# pinned to a full commit SHA ("How a project takes the core" in README.md, point 5). It looks itself whether the pull
# request changes a package list, a lock or shrinkwrap file, an `.npmrc`, the Node version or the calling workflow
# (git's own diff against the base), installs and checks only then, and passes otherwise: so it reports on every pull
# request and a ruleset can require it. Where it cannot tell what changed, it checks. Read-only, with no secret.
name: signatures

on:
  workflow_call:
    inputs:
      directory:
        description: The folder that holds package-lock.json, from the repository's root. Left out, the root itself.
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  signatures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after the checkout needs the token
          fetch-depth: 2 # the merge commit and its parents: the base the first step diffs from
      - name: Does the pull request change what this check reads?
        id: what
        env:
          BASE: ${{ github.event.pull_request.base.sha }} # empty where the caller runs on anything but a pull request
        run: |
          # The checkout is the pull request merged into its base, with both parents, so the diff from the base is what
          # it changes. Any doubt (no base, a base that is not there and cannot be fetched, a git command that fails, a
          # listed file that is a link to another) means the check runs.
          paths=(':(glob)**/package.json' ':(glob)**/package-lock.json' ':(glob)**/npm-shrinkwrap.json'
            ':(glob)**/.npmrc' core/.node-version .github/workflows/signatures.yml)
          run=true
          if [ -n "$BASE" ] \
            && { git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --quiet --no-tags --depth=1 origin "$BASE"; } \
            && changed=$(git diff --no-renames --name-only "$BASE" HEAD -- "${paths[@]}") \
            && listed=$(git ls-files -s -- "${paths[@]}"); then
            if [ -n "$changed" ]; then
              echo "Changed:"
              printf '%s\n' "$changed" | sed 's/^/- /' # behind a dash, so that no file's name starts a workflow command
            elif printf '%s\n' "$listed" | grep -q '^120000 '; then
              echo "A listed file is a link to another, whose changes this step would not see."
            else
              run=false
              echo "No package list, lock file, .npmrc, Node version or signatures workflow changed: nothing to verify."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.what.outputs.run != 'false' # anything but a plain no checks
        with:
          node-version-file: core/.node-version # the one exact Node ("Node" in the core's modules/updates.md)
      - name: Install from the lock file, from the registry alone, running no package's install script
        if: steps.what.outputs.run != 'false' # anything but a plain no checks
        working-directory: ${{ inputs.directory }}
        run: npm ci --ignore-scripts --no-audit --no-fund --allow-git=none --allow-remote=none --allow-file=none
      - name: The registry's signature on each installed name and version
        if: steps.what.outputs.run != 'false' # anything but a plain no checks
        working-directory: ${{ inputs.directory }}
        run: npm audit signatures
      - name: Each lock entry's licence and version, as the installed package says them
        if: steps.what.outputs.run != 'false' # anything but a plain no checks
        working-directory: ${{ inputs.directory }}
        run: node "$GITHUB_WORKSPACE/core/scripts/licence-installed.mjs" .
