# The licences allowed (SECURITY.md, point 10), read by dependency-review-action (.github/workflows/licences.yml) and by
# scripts/licences.mjs (the lockfile check and the build's third-party notices). One list, one place.
license-check: true
vulnerability-check: false
# Every package, not only the runtime ones (the action's default).
fail-on-scopes: [runtime, development, unknown]
# Allowed for any package.
allow-licenses:
  - MIT
  - MIT-0
  - ISC
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - 0BSD
  - CC0-1.0
  - Unlicense
  - Zlib
  - BlueOak-1.0.0
  - Python-2.0
# Data, asset and font packages, each checked by hand to be one: the action lets them through (it cannot tell their
# purpose), and scripts/licences.mjs holds each to allow-licenses plus its purpose's licences below, and fails unless this
# list is exactly data-packages and font-packages together. Adding one is a reviewed change to this file.
allow-dependencies-licenses:
  - pkg:npm/caniuse-lite
# Data and asset packages: CC-BY for data and assets (point 10); PDDL is a public-domain dedication for data.
data-packages:
  - caniuse-lite
data-licenses:
  - CC-BY-3.0
  - CC-BY-4.0
  - PDDL-1.0
# Font packages: OFL for fonts (point 10). None yet.
font-packages: []
font-licenses:
  - OFL-1.1
