# The description check ("Each PR has the headings" in core/modules/git.md): a pull request that is no draft has the
# headings "What the owner can try" and "Readings taken". The core's, on every pull request when it opens, gets a new
# commit, is marked ready or has its description edited, so that one put right passes by itself. Where the readings
# are in the item's report (docs/rounds/), the heading says which report holds them; where there are none, it stands
# with "None" under it. A draft is not asked, nor Dependabot's own. Read-only, and no secrets: the description reaches
# the core's script as data, never in a command.
name: pr-description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  pr-description:
    uses: HaakTuah/agent-core/.github/workflows/pr-description.yml@d79346a019b52cbfadc305d3898c280331f221be
