# The copies, pointer and reading-size checks ("One fact, one place" and "Read little" in core/modules/how-to-work.md),
# on every pull request and push to main, docs-only changes included: the core's, with this game's config and marks.
name: copies

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  copies:
    uses: HaakTuah/agent-core/.github/workflows/copies.yml@8d9d418adf581dc8ff010c4a35606bcf8b825443
    with:
      config: scripts/copies.json
      sizes: scripts/sizes.json
