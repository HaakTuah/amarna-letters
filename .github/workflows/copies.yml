# The copies check ("One fact, one place" in AGENTS.md), on every pull request and push to main: a new copy of code, or
# of the rule files' prose, fails; the old ones its baseline lists are removed over time. It runs for docs-only changes
# too, since the rule files are what it guards most. Node's own modules only: nothing is installed. Read-only.
name: copies

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  copies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: No new copies
        run: node scripts/copies.mjs
