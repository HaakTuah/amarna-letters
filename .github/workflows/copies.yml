# The copies, pointer and reading-size checks ("One fact, one place" and "Read little" in core/roles/shared/how-to-work.md),
# on every pull request and push to main, docs-only changes included: the core's, with this game's config and marks.
name: copies

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  copies:
    uses: HaakTuah/agent-core/.github/workflows/copies.yml@16320a137f7323400af7902b44f5b2bc4ef38027
    with:
      config: scripts/copies.json
      sizes: scripts/sizes.json
