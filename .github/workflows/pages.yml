# Builds and tests the game on every pull request and every push to main.
# A push to main publishes the game to the root of the gh-pages branch, which GitHub Pages serves.
# A pull request only builds its preview and uploads it, with a read-only token; "Publish preview"
# (preview.yml), which always runs main's own copy, puts it at /pr-<number>/ and removes it when the PR closes.
name: Build, test and publish

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# A newer push to the same pull request replaces the older run; runs of main always finish. A PR's group is named by its
# number, not its ref: once a PR is merged, its "closed" run has the base branch's ref, and in the same group it would
# cancel the push to main that the merge started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests run only where they can be affected (Haakon, 28 October 2026:
  # "tests should only run where they impact something"): notes alone
  # (docs/, .claude/, any .md) skip them; the build still runs for the preview.
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.what.outputs.code }}
      web: ${{ steps.what.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What changed
        id: what
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            { echo "code=true"; echo "web=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          code=$(echo "$files" | grep -v -E '^(docs/|\.claude/)|\.md$' | grep -c . || true)
          echo "code=$([ "$code" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # What the app bundles and draws: the app, the packages it bundles (the map and its names live in the engine),
          # and the packages' manifests; never their tests, notes or the batch runner.
          web=$(echo "$files" | grep -E '^(src/(web|engine|game|llm)/|package(-lock)?\.json$)' | grep -v -E '^src/[^/]+/test/|\.md$' | grep -c . || true)
          echo "web=$([ "$web" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Lint and types, beside the tests (Haakon, 29 October 2026: optimizations to development, "do all expertly").
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck

  # The tests, split by file into four shards that run side by side.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  # The Playwright smoke test of the built app (src/web/smoke.mjs), beside the tests, only when the app can be affected:
  # the map's overlapping names of item 11f+ (fixed in #196) went unseen while it ran only by hand.
  smoke:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT: 1.49.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright is the machine's own, not a dependency of the project (as scripts/cloud-setup.sh installs it).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT }}
      - run: npm install --no-save "playwright@$PLAYWRIGHT" && npx playwright install --with-deps chromium
      - run: npm run build --workspace src/web && node src/web/smoke.mjs

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: github.event.action != 'closed'
        run: npm ci

      # The build step: the TypeScript web app (Vite), its static output moved to site/.
      - name: Build
        if: github.event.action != 'closed'
        run: npm run build --workspace src/web && mv src/web/dist site

      - name: Prepare the site
        if: github.event.action != 'closed'
        env:
          PR: ${{ github.event.number }}
        run: |
          repo=${GITHUB_REPOSITORY#*/}
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scripts/site-prepare.sh site "/$repo/pr-$PR/" preview
          else
            scripts/site-prepare.sh site "/$repo/" root
          fi

      # What the publisher reads: the PR's number (checked against the PR itself before use) and, unless it closed,
      # its site.
      - name: Hand the preview to the publisher
        if: github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.number }}
        run: mkdir -p preview && echo "$PR" > preview/pr-number && { [ ! -d site ] || mv site preview/site; }

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: preview
          path: preview
          include-hidden-files: true
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 3

  publish:
    needs: [build, checks, test, smoke]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.build.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.checks.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.test.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.smoke.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Publish to the root of gh-pages
        run: scripts/site-publish.sh root site

  deploy:
    needs: publish
    uses: ./.github/workflows/pages-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
