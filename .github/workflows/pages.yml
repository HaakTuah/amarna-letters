# Builds and tests the game on every pull request; publishes it to GitHub Pages only from main.
name: Build, test and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request replaces the older run; deploys from main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        run: dotnet publish src/Amarna.Web --configuration Release --output publish

      - name: Prepare for Pages
        if: github.ref == 'refs/heads/main'
        run: |
          site=publish/wwwroot
          # The site lives under /<repository>/, so the app's base path must match.
          sed -i "s|<base href=\"/\" />|<base href=\"/${GITHUB_REPOSITORY#*/}/\" />|" "$site/index.html"
          # Deep links such as /play are served the app, whose router takes over.
          cp "$site/index.html" "$site/404.html"
          # Without this, Pages' Jekyll step drops folders starting with an underscore (_framework).
          touch "$site/.nojekyll"

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
