# Builds and tests the game on every pull request and every push to main.
# A push to main publishes the game to the root of the gh-pages branch, which GitHub Pages serves.
# A pull request only builds its preview and uploads it, with a read-only token; "Publish preview"
# (preview.yml), which always runs main's own copy, puts it at /pr-<number>/ and removes it when the PR closes.
name: Build, test and publish

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# A newer push to the same pull request replaces the older run; runs of main always finish. A PR's group is named by its
# number, not its ref: once a PR is merged, its "closed" run has the base branch's ref, and in the same group it would
# cancel the push to main that the merge started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests run only where a change can affect them ("The smallest setup that tests the rule" in
  # core/modules/how-to-work.md): notes alone (docs/, .claude/, any .md, but docs/history/, which a test reads) skip them;
  # the build still runs for the preview. The core's copy, which the core tested before a sync brings it, counts only
  # for what the suites take from it: its Node version runs them all, and its scripts run the type check and the tests
  # that read them ("copy" below). The rest of the copy does not count (core.yml checks it against the core), nor does
  # a workflow in which only the pin of a call to a core workflow moved.
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.what.outputs.code }}
      copy: ${{ steps.what.outputs.copy }}
      web: ${{ steps.what.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: What changed
        id: what
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            { echo "code=true"; echo "copy=false"; echo "web=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          # (--no-renames: a file moved shows as one deleted and one added, so the place it left still counts)
          files=$(git diff --no-renames --name-only "$BASE" HEAD)
          echo "$files"
          norm='s#(haaktuah/agent-core/\.github/workflows/[a-z0-9._-]+\.ya?ml@)[0-9a-f]{40}#\1<pin>#Ig'
          own=$(echo "$files" | while IFS= read -r f; do
            case $f in
              core/.node-version|core/scripts/*) ;;
              core/*) continue ;;
              .github/workflows/*)
                # (a file missing on either side, or sed failing, leaves it counted)
                if old=$(git show "$BASE:$f" 2>/dev/null | sed -E "$norm") && new=$(git show "HEAD:$f" 2>/dev/null | sed -E "$norm") \
                  && [ -n "$old" ] && [ "$old" = "$new" ]; then continue; fi ;;
            esac
            printf '%s\n' "$f"
          done)
          code=$(echo "$own" | { grep -v '^core/scripts/' || true; } | awk '/^docs\/history\// || !/^(docs\/|\.claude\/)|\.md$/' | { grep -c . || true; })
          copy=$(echo "$own" | { grep -c '^core/scripts/' || true; })
          echo "code=$([ "$code" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "copy=$([ "$code" -eq 0 ] && [ "$copy" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # What the app bundles and draws: the app, the packages it bundles (the map and its names live in the engine),
          # and the root manifests and TypeScript settings; never their tests, notes or the batch runner.
          web=$(echo "$files" | grep -E '^(src/(web|engine|game|llm)/|(package(-lock)?|tsconfig(\.base)?)\.json$)' | grep -v -E '^src/[^/]+/test/|\.md$' | grep -c . || true)
          echo "web=$([ "$web" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Lint and types, beside the tests.
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: core/.node-version # the core's one exact Node ("Node" in core/modules/updates.md)
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck

  # The tests, split by file into four shards that run side by side.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: core/.node-version # the core's one exact Node ("Node" in core/modules/updates.md)
          cache: npm
      - run: npm ci
      - run: npx --no-install vitest run --shard=${{ matrix.shard }}/4

  # A change to the core's scripts alone, as a sync brings: only what reads them, the type check (a test's import of
  # one takes its types from the copy) and the tests that name core/scripts/, where the whole suite would test again
  # what no line of the game changed.
  copy:
    needs: changes
    if: needs.changes.outputs.copy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: core/.node-version # the core's one exact Node ("Node" in core/modules/updates.md)
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: The tests that read the core's scripts
        run: |
          set -euo pipefail
          # (each name whole, whatever is in it; none found, which git grep ends 1 on, runs nothing; an error of its own fails)
          { git grep -l -z -F 'core/scripts/' -- ':(glob)src/*/test/**/*.test.ts' ':(glob)src/*/test/**/*.test.tsx' || [ $? -eq 1 ]; } \
            | xargs -0 -r npx --no-install vitest run

  # The check main's ruleset requires for the code: lint, types and every test shard passed, or were all skipped for
  # notes alone, and so for the tests that read the core's copy. A job skipped by its own `if` counts as passed, and so
  # would a required job whose needs failed, so this one always runs and reads their results.
  checks:
    needs: [changes, lint, test, copy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Lint, types and every test shard passed, or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -- $RESULTS
          [ $# -eq 4 ] || { echo "expected the results of changes, lint, test and copy, got: $RESULTS"; exit 1; }
          for r in "$@"; do
            case $r in success|skipped) ;; *) echo "a job before this one ended $r"; exit 1 ;; esac
          done

  # The Playwright smoke test of the built app (src/web/smoke.mjs), beside the tests, only when the app can be affected:
  # the map's overlapping names of item 11f+ (fixed in #196) went unseen while it ran only by hand.
  smoke:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: core/.node-version # the core's one exact Node ("Node" in core/modules/updates.md)
          cache: npm
      - run: npm ci
      # Playwright is a devDependency (package.json, where Dependabot updates it); its browser is cached by its version.
      - run: echo "PLAYWRIGHT=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT }}
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build --workspace src/web && node src/web/smoke.mjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        if: github.event.action != 'closed'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version-file: core/.node-version # the core's one exact Node ("Node" in core/modules/updates.md)
          cache: npm

      - name: Install
        if: github.event.action != 'closed'
        run: npm ci

      # The build step: the TypeScript web app (Vite), its static output moved to site/.
      - name: Build
        if: github.event.action != 'closed'
        run: npm run build --workspace src/web && mv src/web/dist site

      - name: Prepare the site
        if: github.event.action != 'closed'
        env:
          PR: ${{ github.event.number }}
        run: |
          repo=${GITHUB_REPOSITORY#*/}
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scripts/site-prepare.sh site "/$repo/pr-$PR/" preview
          else
            scripts/site-prepare.sh site "/$repo/" root
          fi

      # What the publisher reads: the PR's number (checked against the PR itself before use) and, unless it closed,
      # its site.
      - name: Hand the preview to the publisher
        if: github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.number }}
        run: mkdir -p preview && echo "$PR" > preview/pr-number && { [ ! -d site ] || mv site preview/site; }

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: preview
          path: preview
          include-hidden-files: true
          retention-days: 3

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 3

  publish:
    needs: [build, checks, smoke]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.build.result == 'success' &&
      needs.checks.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.smoke.result)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Publish to the root of gh-pages
        run: core/scripts/site-publish.sh root site
