# Builds and tests the game on every pull request and every push to main.
# A push to main publishes the game to the root of the gh-pages branch, which GitHub Pages serves.
# A pull request only builds its preview and uploads it, with a read-only token; "Publish preview"
# (preview.yml), which always runs main's own copy, puts it at /pr-<number>/ and removes it when the PR closes.
name: Build, test and publish

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# A newer push to the same pull request replaces the older run; deploys from main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: github.event.action != 'closed'

      - uses: actions/setup-dotnet@v4
        if: github.event.action != 'closed'
        with:
          dotnet-version: 10.0.x

      - name: Test
        if: github.event.action != 'closed'
        run: dotnet test --configuration Release

      # The build step: swap this one line for the TypeScript build after the conversion.
      - name: Build
        if: github.event.action != 'closed'
        run: dotnet publish src/Amarna.Web --configuration Release --output publish && mv publish/wwwroot site

      - name: Prepare the site
        if: github.event.action != 'closed'
        env:
          PR: ${{ github.event.number }}
        run: |
          repo=${GITHUB_REPOSITORY#*/}
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scripts/site-prepare.sh site "/$repo/pr-$PR/" preview
          else
            scripts/site-prepare.sh site "/$repo/" root
          fi

      # What the publisher reads: the PR's number (checked against the PR itself before use) and, unless it closed,
      # its site.
      - name: Hand the preview to the publisher
        if: github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.number }}
        run: mkdir -p preview && echo "$PR" > preview/pr-number && { [ ! -d site ] || mv site preview/site; }

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: preview
          path: preview
          include-hidden-files: true
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 3

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Publish to the root of gh-pages
        run: scripts/site-publish.sh root site

  deploy:
    needs: publish
    uses: ./.github/workflows/pages-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
