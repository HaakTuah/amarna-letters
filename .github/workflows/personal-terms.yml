    uses: HaakTuah/agent-core/.github/workflows/personal-terms.yml@aa72682dbaf03cf90ee6be36d2b8f7085748fa20
    secrets:
      PERSONAL_TERMS: ${{ secrets.PERSONAL_TERMS }}
