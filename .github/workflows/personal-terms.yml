# Nothing personal, ever (floor rule 11): the core's check, passed the PERSONAL_TERMS secret alone.
name: Personal terms

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    uses: HaakTuah/agent-core/.github/workflows/personal-terms.yml@f90e369a8b40bd8b417abee838555e978e8faa2d
    secrets:
      PERSONAL_TERMS: ${{ secrets.PERSONAL_TERMS }}
