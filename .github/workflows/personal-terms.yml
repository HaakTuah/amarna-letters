# Nothing personal, ever (floor rule 11): the core's check, passed the PERSONAL_TERMS secret alone.
name: Personal terms

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    uses: HaakTuah/agent-core/.github/workflows/personal-terms.yml@8d9d418adf581dc8ff010c4a35606bcf8b825443
    secrets:
      PERSONAL_TERMS: ${{ secrets.PERSONAL_TERMS }}
