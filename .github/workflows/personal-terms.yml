# Nothing personal, ever (floor rule 11): the core's check, passed the PERSONAL_TERMS secret alone.
name: Personal terms

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: personal-terms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: HaakTuah/agent-core/.github/workflows/personal-terms.yml@2d13e39d7d6062a5524852a9b2107e86b33c5353
    secrets:
      PERSONAL_TERMS: ${{ secrets.PERSONAL_TERMS }}
