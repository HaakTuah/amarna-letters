# The signature check (floor rule 7, "the registry's signature verified"), on every pull request, Dependabot's
# included: the core's. It looks itself whether the pull request changes a package list, a lock file, an .npmrc, the
# Node version or this workflow, and passes at once where it changes none. Otherwise it installs from npm's registry
# alone, running no package's install script, and runs npm's own check of the registry's signature on each installed
# package. What it does not hold is in the header of the core's workflow. Read-only, and no secrets. It reports on
# every pull request, so a ruleset can require it; until one does, the builder merges only once it is green, and not by
# auto-merge alone, which waits only for required checks (floor rule 7: a check that fails holds the release back).
name: signatures

on:
  pull_request:

permissions:
  contents: read

jobs:
  signatures:
    uses: HaakTuah/agent-core/.github/workflows/signatures.yml@77cac90a011556eeeda548f923200e482357171e
