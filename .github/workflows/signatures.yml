# The signature check (floor rule 7, "the registry's signature verified"), on a pull request that changes a package
# list, the lock file, .npmrc or this workflow, Dependabot's included: the core's. It installs from npm's registry
# alone, running no package's install script, and runs npm's own check of the registry's signature on each installed
# package. What it does not hold is in the header of the core's workflow. Read-only, and no secrets. Never a required
# check: it reports only on the pull requests it runs on, so every other one would wait for it for ever. On a pull
# request it runs on, the builder merges only once it is green, and not by auto-merge alone, which waits only for
# required checks (floor rule 7: a check that fails holds the release back).
name: signatures

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - src/*/package.json
      - .npmrc
      - .github/workflows/signatures.yml

permissions:
  contents: read

jobs:
  signatures:
    uses: HaakTuah/agent-core/.github/workflows/signatures.yml@77cac90a011556eeeda548f923200e482357171e
