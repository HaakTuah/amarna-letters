# Publishes a pull request's preview at /pr-<number>/ on the gh-pages branch, and removes it when the PR closes, through
# the core's preview workflow ("How a project takes the core" in core/README.md, point 5): it takes the site the PR's
# build uploaded, checks the PR's number against the PR itself, and writes only pr-<number>/. workflow_run always runs
# main's copy of this file, so no PR can change what it does.
name: Publish preview

on:
  workflow_run:
    workflows: ["Build, test and publish"]  # quoted: unquoted, the comma splits the name in two
    types: [completed]

jobs:
  preview:
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: HaakTuah/agent-core/.github/workflows/preview.yml@f90e369a8b40bd8b417abee838555e978e8faa2d
