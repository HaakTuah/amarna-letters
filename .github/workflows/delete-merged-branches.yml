# A button for the owner: Actions → "Delete merged branches" → Run workflow. The core's, which says what it deletes.
name: Delete merged branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: delete-merged-branches
  cancel-in-progress: false

jobs:
  delete:
    uses: HaakTuah/agent-core/.github/workflows/delete-merged-branches.yml@2d13e39d7d6062a5524852a9b2107e86b33c5353
    with:
      dry_run: ${{ inputs.dry_run }}
