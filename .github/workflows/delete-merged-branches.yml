# A button for the owner: Actions → "Delete merged branches" → Run workflow. The core's, which says what it deletes.
name: Delete merged branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    uses: HaakTuah/agent-core/.github/workflows/delete-merged-branches.yml@aa72682dbaf03cf90ee6be36d2b8f7085748fa20
    with:
      dry_run: ${{ inputs.dry_run }}
