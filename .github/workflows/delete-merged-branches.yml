# A button for the owner: Actions → "Delete merged branches" → Run workflow. The core's, which says what it deletes.
name: Delete merged branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    uses: HaakTuah/agent-core/.github/workflows/delete-merged-branches.yml@f90e369a8b40bd8b417abee838555e978e8faa2d
    with:
      dry_run: ${{ inputs.dry_run }}
