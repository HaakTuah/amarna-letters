# CodeQL on every PR into main, every push to it, and weekly (core/modules/updates.md): the core's, with this game's
# languages.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: HaakTuah/agent-core/.github/workflows/codeql.yml@8d9d418adf581dc8ff010c4a35606bcf8b825443
    with:
      languages: '["actions", "javascript-typescript", "python"]'
