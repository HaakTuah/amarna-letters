# CodeQL on every PR into main, every push to it, and weekly (core/modules/updates.md): the core's, with this game's
# languages.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: HaakTuah/agent-core/.github/workflows/codeql.yml@2d13e39d7d6062a5524852a9b2107e86b33c5353
    with:
      languages: '["actions", "javascript-typescript", "python"]'
