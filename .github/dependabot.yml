# Dependabot version updates (core/modules/updates.md; floor rule 17). The core's workflow pins move only by a sync PR.
# A release is proposed only a week after it came out (cooldown), so a bad release is usually pulled first.
# What it cannot see is Node, the core's pin (core/.node-version), which the core's own monthly versions check watches.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "HaakTuah/agent-core*"
    groups:
      actions:
        patterns: ["*"]
