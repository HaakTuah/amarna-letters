<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <title>Amarna Letters</title>
    <meta name="description" content="A strategy game of the Late Bronze Age Great Kings, where every word passes through an envoy." />
    <meta name="theme-color" content="#efe5cf" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Amarna" />
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
        // The reader's theme, chosen in the game's menu: kept in this browser only, and the page works without it.
        window.amarnaTheme = {
            get() { try { return localStorage.getItem("amarna-theme") || ""; } catch { return ""; } },
            set(t) {
                try { if (t) localStorage.setItem("amarna-theme", t); else localStorage.removeItem("amarna-theme"); } catch { }
                if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
            },
        };
        (function () { const t = window.amarnaTheme.get(); if (t) document.documentElement.dataset.theme = t; })();
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot-title">Amarna <span>Letters</span></div>
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
            <p class="boot-note">The first visit downloads the game, about 3 MB. Later visits start from this device.</p>
        </div>
    </div>
    <script>
        // A later visit, started from this device: the note about the first download is not for it.
        if (navigator.serviceWorker && navigator.serviceWorker.controller) document.querySelector(".boot-note")?.remove();
    </script>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Installable, and fast from cache on later visits (see service-worker.published.js).
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }).catch(() => { });
    </script>
</body>

</html>
